<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Battle Ready Shelf</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      //
      // GitHub Pages is a static file host with no server-side rewrites, so a hard
      // refresh/deep link (e.g. /BattleReadyShelf/collections/<id>) 404s because no such
      // file exists. This script takes that 404'd path and re-encodes it into a query
      // string on a redirect back to /BattleReadyShelf/, where the matching script in
      // index.html decodes it back into the real path via history.replaceState before
      // React Router mounts, so client-side routing can take over.
      var pathSegmentsToKeep = 1; // keep the "/BattleReadyShelf" repo-name segment

      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
