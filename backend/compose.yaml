services:
  postgres:
    image: 'postgres:latest'
    container_name: battlereadyshelf-postgres
    environment:
      POSTGRES_DB: battlereadyshelf
      POSTGRES_USER: keith
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d battlereadyshelf -U keith"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
