spring:
  profiles:
    active: local
  application:
    name: battlereadyshelf
  mvc:
    servlet:
      path: /battlereadyshelf
  flyway:
    schemas: battlereadyshelf
    default-schema: battlereadyshelf
    create-schemas: true
    baseline-on-migrate: false
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: battlereadyshelf