spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/battlereadyshelf
    username: keith
    password: password
  jpa:
    hibernate.ddl-auto: validate
    show-sql: true
app:
  storage:
    uploads:
      bucket: battlereadyshelf-dev
      prefix: keith
      enabled: true
      max-file-size-mb: 10
      max-storage-per-user-mb: 500
      max-uploads-per-hour: 100
  jwt:
    secret: ${JWT_SECRET:local-secret-key-for-development-only}
    expiration-ms: 86400000
battlereadyshelf:
  cors:
    allowed:
      origins: http://localhost:*