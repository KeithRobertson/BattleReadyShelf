openapi: 3.0.3

info:
  title: Warhammer Builder API
  version: 1.0.0

paths:
  /units:
    get:
      operationId: getUnits
      tags:
        - Units
      responses:
        '200':
          description: List of units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UnitDefinition'

components:
  schemas:
    UnitDefinition:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        battleline:
          type: boolean