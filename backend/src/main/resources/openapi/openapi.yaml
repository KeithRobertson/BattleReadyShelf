        '400':
          description: The document's schemaVersion is not supported, or it references an unknown parent faction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
