            type: string
            format: uuid
      responses:
        '204':
          description: The pending change was discarded
        '403':
          description: The authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Draft not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/admin/factions/{factionId}/publish-history:
    get:
