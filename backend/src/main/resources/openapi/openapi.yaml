openapi: 3.0.3
info:
  title: BattleReadyShelf API
  version: 0.1.0
  description: BattleReadyShelf API
servers:
  - url: /
paths:
  /api/v1/auth/google:
    post:
      tags: [ "Auth" ]
      summary: Authenticate with a Google ID token
      operationId: authenticateWithGoogle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or expired Google ID token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Email is not allowed to access the application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/users/me:
    get:
      tags: [ "Users" ]
      summary: Get the current authenticated user
      operationId: getCurrentUser
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: The current authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/army-collections:
    get:
      tags: [ "ArmyCollections" ]
      summary: Get all army collections
      operationId: getArmyCollections
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: A list of army collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArmyCollection'
              example:
                - id: "11111111-1111-1111-1111-111111111111"
                  name: "Starter Collection"
                  description: "An example collection"
    post:
      tags: [ "ArmyCollections" ]
      summary: Create a new army collection
      operationId: createArmyCollection
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArmyCollection'
      responses:
        '201':
          description: Created army collections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArmyCollection'
  /api/v1/model-definitions:
    get:
      tags: [ "ModelDefinitions" ]
      summary: Get all available model types (e.g. Poxwalker)
      operationId: getModelDefinitions
      responses:
        '200':
          description: A list of model definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelDefinition'
  /api/v1/army-collections/{armyCollectionId}/models:
    get:
      tags: [ "CollectionModels" ]
      summary: Get all models in an army collection
      operationId: getCollectionModels
      security:
        - bearerAuth: [ ]
      parameters:
        - name: armyCollectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A list of models in the army collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionModel'
        '404':
          description: Army collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags: [ "CollectionModels" ]
      summary: Add a new model to an army collection
      operationId: createCollectionModel
      security:
        - bearerAuth: [ ]
      parameters:
        - name: armyCollectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionModel'
      responses:
        '201':
          description: The created collection model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionModel'
        '404':
          description: Army collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/collection-models/{collectionModelId}/images:
    post:
      tags: [ "CollectionModelImages" ]
      summary: Request a presigned URL to upload a new image for a collection model
      operationId: createCollectionModelImageUploadUrl
      security:
        - bearerAuth: [ ]
      parameters:
        - name: collectionModelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionModelImageUploadRequest'
      responses:
        '201':
          description: The created image record and a presigned upload URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionModelImageUploadResponse'
        '400':
          description: Invalid content type, file too large, or uploads disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Collection model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/collection-models/{collectionModelId}/images/{imageId}:
    delete:
      tags: [ "CollectionModelImages" ]
      summary: Delete an image attached to a collection model
      operationId: deleteCollectionModelImage
      security:
        - bearerAuth: [ ]
      parameters:
        - name: collectionModelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Image deleted
        '404':
          description: Collection model or image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      properties:
        message:
          type: string
      required: [ message ]
    ArmyCollection:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        description:
          type: string
      required: [ name ]
    ModelDefinition:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
      required: [ name ]
    CollectionModelImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        contentType:
          type: string
          readOnly: true
        sizeBytes:
          type: integer
          format: int64
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
          description: A short-lived presigned URL to download/view the image.
    CollectionModelImageUploadRequest:
      type: object
      properties:
        contentType:
          type: string
          example: "image/jpeg"
        fileName:
          type: string
        contentLengthBytes:
          type: integer
          format: int64
      required: [ contentType, contentLengthBytes ]
    CollectionModelImageUploadResponse:
      type: object
      properties:
        image:
          $ref: '#/components/schemas/CollectionModelImage'
        uploadUrl:
          type: string
          format: uri
          description: A short-lived presigned URL. PUT the raw image bytes here with a matching Content-Type header.
      required: [ image, uploadUrl ]
    CollectionModel:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        modelDefinitionId:
          type: string
          format: uuid
        modelDefinition:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/ModelDefinition'
        name:
          type: string
        description:
          type: string
        images:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/CollectionModelImage'
      required: [ modelDefinitionId ]
    GoogleAuthRequest:
      type: object
      properties:
        idToken:
          type: string
      required: [ idToken ]
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserDto'
      required: [ token, user ]
    UserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
      required: [ id, email ]
