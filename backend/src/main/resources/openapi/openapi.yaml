            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      tags: [ "ModelDefinitionAdmin" ]
      summary: Replace the full contents of a draft (admin only)
      operationId: updateModelDefinitionDraft
      security:
        - bearerAuth: [ ]
      parameters:
        - name: draftId
