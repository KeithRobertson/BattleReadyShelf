  /api/v1/admin/factions/{factionId}:
    patch:
      tags: [ "FactionDefinitionAdmin" ]
      summary: >-
        Propose a change to a faction (admin only). The change is staged for review rather than
        applied: a faction groups every model definition beneath it, so renaming or reparenting
        one is reviewed before it takes effect. Proposing the values already stored instead
        clears any pending change and returns 204.
      operationId: proposeFactionChange
      security:
        - bearerAuth: [ ]
      parameters:
        - name: factionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFactionRequest'
      responses:
        '200':
          description: The staged change, awaiting review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactionDraft'
        '204':
          description: The proposal matches what is already stored, so nothing is staged
        '400':
          description: The proposed parent is the faction itself or one of its descendants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Faction not found
