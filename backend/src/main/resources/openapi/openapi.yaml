openapi: 3.0.3
info:
  title: BattleReadyShelf API
  version: 0.1.0
  description: BattleReadyShelf API
servers:
  - url: /
paths:
  /api/v1/auth/google:
    post:
      tags: [ "Auth" ]
      summary: Authenticate with a Google ID token
      operationId: authenticateWithGoogle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or expired Google ID token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Email is not allowed to access the application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/users/me:
    get:
      tags: [ "Users" ]
      summary: Get the current authenticated user
      operationId: getCurrentUser
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: The current authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/users/me/theme-preference:
    patch:
      tags: [ "Users" ]
      summary: Update the current authenticated user's theme preference
      operationId: updateMyThemePreference
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateThemePreferenceRequest'
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/users:
    get:
      tags: [ "Users" ]
      summary: Get all users (admin only)
      operationId: getUsers
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: A list of all users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDto'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/users/{userId}/role:
    patch:
      tags: [ "Users" ]
      summary: Update another user's role (admin only)
      operationId: updateUserRole
      security:
        - bearerAuth: [ ]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleRequest'
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The authenticated user is not an admin, or the target user's role cannot be modified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/users/roles:
    patch:
      tags: [ "Users" ]
      summary: Update multiple users' roles at once (admin only)
      operationId: bulkUpdateUserRoles
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateUserRolesRequest'
      responses:
        '200':
          description: >-
            The users that were successfully updated. Users that don't exist, are the
            superadmin, or are the acting admin themselves are silently skipped rather than
            failing the whole batch.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDto'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The authenticated user is not an admin, or the requested role cannot be assigned in bulk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/army-collections:
    get:
      tags: [ "ArmyCollections" ]
      summary: Get all army collections
      operationId: getArmyCollections
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: A list of army collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArmyCollection'
              example:
                - id: "11111111-1111-1111-1111-111111111111"
                  name: "Starter Collection"
                  description: "An example collection"
    post:
      tags: [ "ArmyCollections" ]
      summary: Create a new army collection
      operationId: createArmyCollection
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArmyCollection'
      responses:
        '201':
          description: Created army collections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArmyCollection'
  /api/v1/army-collections/order:
    patch:
      tags: [ "ArmyCollections" ]
      summary: Reorder the current user's army collections (drag-to-reorder on the Collections page)
      operationId: reorderArmyCollections
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderArmyCollectionsRequest'
      responses:
        '200':
          description: The army collections in their new order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArmyCollection'
        '400':
          description: The given ids don't match exactly the user's existing army collection ids
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/army-collections/{armyCollectionId}:
    get:
      tags: [ "ArmyCollections" ]
      summary: Get a single army collection
      operationId: getArmyCollection
      security:
        - bearerAuth: [ ]
      parameters:
        - name: armyCollectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The army collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArmyCollection'
        '404':
          description: Army collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      tags: [ "ArmyCollections" ]
      summary: Rename/update an army collection
      operationId: updateArmyCollection
      security:
        - bearerAuth: [ ]
      parameters:
        - name: armyCollectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArmyCollectionRequest'
      responses:
        '200':
          description: The updated army collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArmyCollection'
        '404':
          description: Army collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/army-collections/{armyCollectionId}/model-definition-order:
    patch:
      tags: [ "ArmyCollections" ]
      summary: >-
        Reorder the model-definition groups (accordion sections) shown within an army collection's
        model list
      operationId: reorderModelDefinitionGroups
      security:
        - bearerAuth: [ ]
      parameters:
        - name: armyCollectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderModelDefinitionGroupsRequest'
      responses:
        '200':
          description: The updated army collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArmyCollection'
        '404':
          description: Army collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/model-definitions:
    get:
      tags: [ "ModelDefinitions" ]
      summary: Get all available model types (e.g. Poxwalker)
      operationId: getModelDefinitions
      responses:
        '200':
          description: A list of model definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelDefinition'
  /api/v1/admin/model-definitions/drafts:
    get:
      tags: [ "ModelDefinitionAdmin" ]
      summary: List all open model definition drafts (admin only)
      operationId: getModelDefinitionDrafts
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: A list of all open drafts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelDefinitionDraft'
        '403':
          description: The authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags: [ "ModelDefinitionAdmin" ]
      summary: Create a new, brand-new (not-yet-published) model definition draft (admin only)
      operationId: createModelDefinitionDraft
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertModelDefinitionDraftRequest'
      responses:
        '201':
          description: The created draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDefinitionDraft'
        '403':
          description: The authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/admin/model-definitions/{modelDefinitionId}/draft:
    post:
      tags: [ "ModelDefinitionAdmin" ]
      summary: >-
        Start (or resume, if one is already open) editing a published model definition,
        seeding the draft from its current published state on first call (admin only)
      operationId: startModelDefinitionDraft
      security:
        - bearerAuth: [ ]
      parameters:
        - name: modelDefinitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The existing or newly-created draft for this model definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDefinitionDraft'
        '403':
          description: The authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Model definition not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/admin/model-definitions/{modelDefinitionId}:
    delete:
      tags: [ "ModelDefinitionAdmin" ]
      summary: >-
        Permanently delete a published model definition, its attachment slots/wargear options,
        any open draft for it, and its publish history. Refused if any user's collection models
        still reference it (admin only)
      operationId: deleteModelDefinition
      security:
        - bearerAuth: [ ]
      parameters:
        - name: modelDefinitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The model definition was deleted
        '403':
          description: The authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Model definition not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The model definition is still referenced by user collection models
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/admin/model-definitions/drafts/{draftId}:
    get:
      tags: [ "ModelDefinitionAdmin" ]
      summary: Get a single draft (admin only)
      operationId: getModelDefinitionDraft
      security:
        - bearerAuth: [ ]
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDefinitionDraft'
        '403':
          description: The authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Draft not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      tags: [ "ModelDefinitionAdmin" ]
      summary: Replace the full contents of a draft (admin only)
      operationId: updateModelDefinitionDraft
      security:
        - bearerAuth: [ ]
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertModelDefinitionDraftRequest'
      responses:
        '200':
          description: The updated draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDefinitionDraft'
        '403':
          description: The authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Draft not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [ "ModelDefinitionAdmin" ]
      summary: Discard a draft without publishing it (admin only)
      operationId: discardModelDefinitionDraft
      security:
        - bearerAuth: [ ]
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The draft was discarded
        '403':
          description: The authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Draft not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/admin/model-definitions/drafts/{draftId}/publish:
    post:
      tags: [ "ModelDefinitionAdmin" ]
      summary: >-
        Publish a draft, upserting its data onto the live model definition (creating one if
        this draft was not-yet-published) and recording an audit entry (admin only)
      operationId: publishModelDefinitionDraft
      security:
        - bearerAuth: [ ]
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishModelDefinitionDraftRequest'
      responses:
        '200':
          description: The published model definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDefinition'
        '403':
          description: The authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Draft not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/admin/model-definitions/{modelDefinitionId}/publish-history:
    get:
      tags: [ "ModelDefinitionAdmin" ]
      summary: Get the publish audit history for a model definition, newest first (admin only)
      operationId: getModelDefinitionPublishHistory
      security:
        - bearerAuth: [ ]
      parameters:
        - name: modelDefinitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The publish history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelDefinitionPublishAuditEntry'
        '403':
          description: The authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/admin/model-definitions/export:
    get:
      tags: [ "ModelDefinitionAdmin" ]
      summary: Export all published model definitions as a versioned JSON document (admin only)
      operationId: exportModelDefinitions
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: The exported model definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDefinitionExport'
        '403':
          description: The authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/admin/model-definitions/import:
    post:
      tags: [ "ModelDefinitionAdmin" ]
      summary: >-
        Import a versioned JSON document of model definitions as drafts (matching by name to
        existing published model definitions where possible). Imported data is never published
        automatically - each imported definition must still be reviewed and published (admin only)
      operationId: importModelDefinitions
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelDefinitionExport'
      responses:
        '200':
          description: The drafts created or updated by the import
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelDefinitionDraft'
        '400':
          description: The document's schemaVersion is not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/army-collections/{armyCollectionId}/models:
    get:
      tags: [ "CollectionModels" ]
      summary: Get all models in an army collection
      operationId: getCollectionModels
      security:
        - bearerAuth: [ ]
      parameters:
        - name: armyCollectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A list of models in the army collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionModel'
        '404':
          description: Army collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags: [ "CollectionModels" ]
      summary: Add a new model to an army collection
      operationId: createCollectionModel
      security:
        - bearerAuth: [ ]
      parameters:
        - name: armyCollectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionModel'
      responses:
        '201':
          description: The created collection model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionModel'
        '404':
          description: Army collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/army-collections/{armyCollectionId}/models/bulk:
    post:
      tags: [ "CollectionModels" ]
      summary: Add many models of a single model definition to an army collection at once
      operationId: bulkCreateCollectionModels
      security:
        - bearerAuth: [ ]
      parameters:
        - name: armyCollectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCreateCollectionModelsRequest'
      responses:
        '201':
          description: The created collection models (unnamed; name them individually afterwards)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionModel'
        '404':
          description: Army collection or model definition not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/collection-models/{collectionModelId}:
    patch:
      tags: [ "CollectionModels" ]
      summary: Rename/update a collection model
      operationId: updateCollectionModel
      security:
        - bearerAuth: [ ]
      parameters:
        - name: collectionModelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCollectionModelRequest'
      responses:
        '200':
          description: The updated collection model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionModel'
        '404':
          description: Collection model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [ "CollectionModels" ]
      summary: Delete a collection model (and its images)
      operationId: deleteCollectionModel
      security:
        - bearerAuth: [ ]
      parameters:
        - name: collectionModelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The collection model was deleted
        '404':
          description: Collection model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/army-collections/{armyCollectionId}/models/bulk-delete:
    post:
      tags: [ "CollectionModels" ]
      summary: Delete many collection models (and their images) at once
      operationId: bulkDeleteCollectionModels
      security:
        - bearerAuth: [ ]
      parameters:
        - name: armyCollectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteCollectionModelsRequest'
      responses:
        '204':
          description: >-
            The collection models that exist and belong to this army collection were deleted;
            others were silently skipped.
        '404':
          description: Army collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/collection-models/{collectionModelId}/images:
    post:
      tags: [ "CollectionModelImages" ]
      summary: Request a presigned URL to upload a new image for a collection model
      operationId: createCollectionModelImageUploadUrl
      security:
        - bearerAuth: [ ]
      parameters:
        - name: collectionModelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionModelImageUploadRequest'
      responses:
        '201':
          description: The created image record and a presigned upload URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionModelImageUploadResponse'
        '400':
          description: Invalid content type, file too large, or uploads disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Collection model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/collection-models/{collectionModelId}/images/{imageId}:
    delete:
      tags: [ "CollectionModelImages" ]
      summary: Delete an image attached to a collection model
      operationId: deleteCollectionModelImage
      security:
        - bearerAuth: [ ]
      parameters:
        - name: collectionModelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Image deleted
        '404':
          description: Collection model or image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      properties:
        message:
          type: string
      required: [ message ]
    ArmyCollection:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        description:
          type: string
        modelCount:
          type: integer
          format: int32
          readOnly: true
          description: Total number of collection models in this army collection.
        modelCountsByStatus:
          type: object
          readOnly: true
          description: >-
            Number of collection models in this army collection per status. Statuses with no
            models are omitted.
          additionalProperties:
            type: integer
            format: int32
        modelDefinitionOrder:
          type: array
          readOnly: true
          description: >-
            The user's chosen display order of model-definition groups (accordion sections) within
            this collection, as model definition ids. Only definitions the user has explicitly
            reordered are listed here; any other groups present in the collection should be shown
            after these, in alphabetical order.
          items:
            type: string
            format: uuid
      required: [ name ]
    UpdateArmyCollectionRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
    ReorderArmyCollectionsRequest:
      type: object
      properties:
        armyCollectionIds:
          type: array
          description: >-
            All of the current user's army collection ids, in the desired display order. Must be
            exactly the set of the user's existing army collection ids.
          items:
            type: string
            format: uuid
      required: [ armyCollectionIds ]
    ReorderModelDefinitionGroupsRequest:
      type: object
      properties:
        modelDefinitionIds:
          type: array
          description: The model definition ids present in this collection, in the desired display order.
          items:
            type: string
            format: uuid
      required: [ modelDefinitionIds ]
    ModelDefinition:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        externalId:
          type: string
          readOnly: true
          description: >-
            Stable identifier from an imported reference dataset (e.g. battlereadyshelf-data),
            used to match this definition across re-imports. Null for definitions created directly
            in the admin UI rather than via import.
        factionId:
          type: string
          format: uuid
          readOnly: true
          description: The faction this model belongs to, if any.
        name:
          type: string
        description:
          type: string
        version:
          type: integer
          format: int32
          readOnly: true
          description: Incremented every time this model definition is published.
        attachmentSlots:
          readOnly: true
          type: array
          description: >-
            Slots on this model (e.g. "Left Arm", "Right Arm") that can be filled with wargear.
          items:
            $ref: '#/components/schemas/AttachmentSlot'
        wargearOptions:
          readOnly: true
          type: array
          description: >-
            Known wargear options for this model, and which slot(s) each one fills. This is not
            an exhaustive/enforced list - it exists to describe common/default loadouts.
          items:
            $ref: '#/components/schemas/WargearOption'
      required: [ name ]
    Faction:
      type: object
      description: >-
        Categorises model definitions for catalogue organisation/filtering only - it carries no
        army-building rules (legality, availability, inclusion/exclusion, points, etc.).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        externalId:
          type: string
          description: Stable identifier used to match this faction across imports.
        name:
          type: string
        parentFactionId:
          type: string
          format: uuid
          description: Null if this faction has no parent.
      required: [ externalId, name ]
    AttachmentSlot:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        externalId:
          type: string
          readOnly: true
          description: Stable identifier from an imported reference dataset, if this slot was created/matched via import.
        name:
          type: string
      required: [ name ]
    WargearOption:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        externalId:
          type: string
          readOnly: true
          description: Stable identifier from an imported reference dataset, if this option was created/matched via import.
        name:
          type: string
        isDefault:
          type: boolean
          description: Whether this option is part of the model's default loadout.
        attachmentSlotIds:
          type: array
          description: >-
            The slot(s) this wargear option fills. An option filling more than one slot (e.g. a
            two-handed weapon) consumes all of those slots at once.
          items:
            type: string
            format: uuid
      required: [ name, isDefault, attachmentSlotIds ]
    ModelDefinitionDraft:
      type: object
      description: An admin's in-progress edit of a model definition, not visible to regular users.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        publishedModelDefinitionId:
          type: string
          format: uuid
          readOnly: true
          description: Null if this draft has never been published (a brand-new model definition).
        externalId:
          type: string
          readOnly: true
          description: Stable identifier from an imported reference dataset, if this draft was created/updated via import.
        factionId:
          type: string
          format: uuid
          readOnly: true
          description: The faction this model belongs to, if set via import.
        name:
          type: string
        description:
          type: string
        attachmentSlots:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentSlotDraft'
        wargearOptions:
          type: array
          items:
            $ref: '#/components/schemas/WargearOptionDraft'
        createdBy:
          type: string
          format: uuid
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required: [ name, attachmentSlots, wargearOptions ]
    AttachmentSlotDraft:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        publishedAttachmentSlotId:
          type: string
          format: uuid
          readOnly: true
          description: Null if this slot is new and has never been published.
        externalId:
          type: string
          readOnly: true
          description: Stable identifier from an imported reference dataset, if this slot was created/matched via import.
        name:
          type: string
      required: [ name ]
    WargearOptionDraft:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        publishedWargearOptionId:
          type: string
          format: uuid
          readOnly: true
          description: Null if this option is new and has never been published.
        externalId:
          type: string
          readOnly: true
          description: Stable identifier from an imported reference dataset, if this option was created/matched via import.
        name:
          type: string
        isDefault:
          type: boolean
        attachmentSlotIds:
          type: array
          description: The draft attachment slot id(s) this option fills.
          items:
            type: string
            format: uuid
      required: [ name, isDefault, attachmentSlotIds ]
    UpsertModelDefinitionDraftRequest:
      type: object
      description: >-
        Full replacement of a draft's contents. Attachment slots and wargear options that already
        exist in the draft should be sent with their existing draft id so they are updated in
        place; new ones should have a client-generated id (a fresh random UUID) so wargear options
        in the same request can reference them by that id. Any existing slot/option not present in
        the request is removed from the draft.
      properties:
        name:
          type: string
        description:
          type: string
        attachmentSlots:
          type: array
          items:
            $ref: '#/components/schemas/UpsertAttachmentSlotDraftRequest'
        wargearOptions:
          type: array
          items:
            $ref: '#/components/schemas/UpsertWargearOptionDraftRequest'
      required: [ name, attachmentSlots, wargearOptions ]
    UpsertAttachmentSlotDraftRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The draft slot id (existing, or a freshly client-generated one for a new slot).
        name:
          type: string
      required: [ id, name ]
    UpsertWargearOptionDraftRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The draft option id (existing, or a freshly client-generated one for a new option).
        name:
          type: string
        isDefault:
          type: boolean
        attachmentSlotIds:
          type: array
          items:
            type: string
            format: uuid
      required: [ id, name, isDefault, attachmentSlotIds ]
    PublishModelDefinitionDraftRequest:
      type: object
      properties:
        changeSummary:
          type: string
          description: Optional admin-supplied note describing what changed, stored in the audit trail.
    ModelDefinitionPublishAuditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        modelDefinitionId:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          format: int32
          readOnly: true
        publishedBy:
          type: string
          format: uuid
          readOnly: true
        publishedAt:
          type: string
          format: date-time
          readOnly: true
        changeSummary:
          type: string
          readOnly: true
        snapshot:
          type: string
          readOnly: true
          description: A JSON snapshot of the published model definition immediately after this publish.
    ModelDefinitionExport:
      type: object
      description: A versioned, portable document of published model definitions for backup/migration.
      properties:
        schemaVersion:
          type: integer
          format: int32
          description: The version of this export document's schema, incremented on breaking changes.
        exportedAt:
          type: string
          format: date-time
          readOnly: true
        factions:
          type: array
          description: >-
            The complete set of factions referenced by 'modelDefinitions' in this document.
            Factions are upserted by 'externalId' on import (created if new, updated in place if
            already known) - they carry no army-building rules, purely catalogue organisation.
          items:
            $ref: '#/components/schemas/FactionExportItem'
        modelDefinitions:
          type: array
          items:
            $ref: '#/components/schemas/ModelDefinitionExportItem'
      required: [ schemaVersion, factions, modelDefinitions ]
    FactionExportItem:
      type: object
      properties:
        externalId:
          type: string
          description: Stable identifier used to match this faction across imports.
        name:
          type: string
        parentFactionExternalId:
          type: string
          description: The externalId of the parent faction (from this same 'factions' list), if any.
      required: [ externalId, name ]
    ModelDefinitionExportItem:
      type: object
      properties:
        externalId:
          type: string
          description: >-
            Optional stable identifier used to match this model definition across imports (e.g.
            from the battlereadyshelf-data reference dataset repository), instead of matching by
            name. Null for hand-authored definitions with no external source.
        factionExternalId:
          type: string
          description: >-
            The externalId of the faction (from this document's 'factions' list) this model
            belongs to. Optional - null if this model is not categorised under any faction.
        name:
          type: string
        description:
          type: string
        attachmentSlots:
          type: array
          items:
            type: object
            properties:
              externalId:
                type: string
                description: >-
                  Optional stable identifier for this slot, used to prefer matching it across
                  imports by id rather than by name. Slot-to-option relationships within this
                  item are still keyed by 'name' (see 'attachmentSlotNames' below), so slot names
                  must be unique within a single model definition.
              name:
                type: string
            required: [ name ]
        wargearOptions:
          type: array
          items:
            type: object
            properties:
              externalId:
                type: string
                description: Optional stable identifier used to prefer matching this option across imports by id.
              name:
                type: string
              isDefault:
                type: boolean
              attachmentSlotNames:
                type: array
                description: The name(s) of the attachment slot(s), from this same item, this option fills.
                items:
                  type: string
            required: [ name, isDefault, attachmentSlotNames ]
      required: [ name, attachmentSlots, wargearOptions ]
    CollectionModelImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        contentType:
          type: string
          readOnly: true
          description: The content type of the large (~1600px) rendition.
        sizeBytes:
          type: integer
          format: int64
          readOnly: true
          description: The size in bytes of the large (~1600px) rendition.
        thumbnailUrl:
          type: string
          format: uri
          readOnly: true
          description: A short-lived presigned URL for a small (~300px) thumbnail rendition, for use in list/grid views.
        largeUrl:
          type: string
          format: uri
          readOnly: true
          description: A short-lived presigned URL for a large (~1600px) rendition, for use in detail views.
    ImageVariantUploadRequest:
      type: object
      properties:
        contentType:
          type: string
          example: "image/jpeg"
        contentLengthBytes:
          type: integer
          format: int64
      required: [ contentType, contentLengthBytes ]
    CollectionModelImageUploadRequest:
      type: object
      properties:
        large:
          $ref: '#/components/schemas/ImageVariantUploadRequest'
        thumbnail:
          $ref: '#/components/schemas/ImageVariantUploadRequest'
      required: [ large, thumbnail ]
    ImageVariantUploadUrls:
      type: object
      description: >-
        Short-lived presigned URLs. PUT the raw bytes for each rendition here with a matching
        Content-Type header.
      properties:
        large:
          type: string
          format: uri
        thumbnail:
          type: string
          format: uri
      required: [ large, thumbnail ]
    CollectionModelImageUploadResponse:
      type: object
      properties:
        image:
          $ref: '#/components/schemas/CollectionModelImage'
        uploadUrls:
          $ref: '#/components/schemas/ImageVariantUploadUrls'
      required: [ image, uploadUrls ]
    CollectionModel:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        modelDefinitionId:
          type: string
          format: uuid
        modelDefinition:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/ModelDefinition'
        name:
          type: string
        description:
          type: string
        finishedOn:
          type: string
          format: date
          description: The date the model was finished being painted, if known.
        status:
          allOf:
            - $ref: '#/components/schemas/CollectionModelStatus'
        images:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/CollectionModelImage'
        wargearSelections:
          readOnly: true
          type: array
          description: >-
            What the user has assigned to each of this model's attachment slots, if any.
          items:
            $ref: '#/components/schemas/WargearSelection'
      required: [ modelDefinitionId ]
    WargearSelection:
      type: object
      properties:
        attachmentSlotId:
          type: string
          format: uuid
        wargearOptionId:
          type: string
          format: uuid
          description: The wargear option assigned to this slot, or null/omitted to leave it empty.
        customLabel:
          type: string
          description: >-
            A free-text wargear name for this slot when nothing in the model definition's
            recognised wargear options matches what the user actually modeled (e.g. a
            conversion). Mutually exclusive with wargearOptionId: setting both on the same
            selection is rejected. Custom labels are personal to this collection model and are
            not considered by army list validation.
      required: [ attachmentSlotId ]
    CollectionModelStatus:
      type: string
      description: >-
        A collection model's progress through the typical painting pipeline.
      enum: [ BOXED, ASSEMBLING, ASSEMBLED, PRIMING, PRIMED, PAINTING, PAINTED ]
    BulkCreateCollectionModelsRequest:
      type: object
      properties:
        modelDefinitionId:
          type: string
          format: uuid
        count:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
      required: [ modelDefinitionId, count ]
    BulkDeleteCollectionModelsRequest:
      type: object
      properties:
        collectionModelIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
      required: [ collectionModelIds ]
    UpdateCollectionModelRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        finishedOn:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/CollectionModelStatus'
        wargearSelections:
          type: array
          description: >-
            If present, replaces all of this model's wargear slot assignments. Omit to leave
            existing assignments unchanged.
          items:
            $ref: '#/components/schemas/WargearSelection'
    GoogleAuthRequest:
      type: object
      properties:
        idToken:
          type: string
      required: [ idToken ]
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserDto'
      required: [ token, user ]
    UserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/UserRole'
        themePreference:
          allOf:
            - $ref: '#/components/schemas/ThemePreference'
      required: [ id, email ]
    UserRole:
      type: string
      enum: [ USER, ADMIN, SUPERADMIN ]
    ThemePreference:
      type: string
      description: >-
        A user's preferred UI colour scheme. AUTO follows the device's system preference.
      enum: [ LIGHT, DARK, AUTO ]
    UpdateUserRoleRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
      required: [ role ]
    UpdateThemePreferenceRequest:
      type: object
      properties:
        themePreference:
          $ref: '#/components/schemas/ThemePreference'
      required: [ themePreference ]
    BulkUpdateUserRolesRequest:
      type: object
      properties:
        userIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        role:
          $ref: '#/components/schemas/UserRole'
      required: [ userIds, role ]
