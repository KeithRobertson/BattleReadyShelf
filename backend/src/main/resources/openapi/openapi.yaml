openapi: 3.0.3
info:
  title: BattleReadyShelf API
  version: 0.1.0
  description: BattleReadyShelf API
servers:
  - url: /
paths:
  /api/v1/auth/google:
    post:
      tags: [ "Auth" ]
      summary: Authenticate with a Google ID token
      operationId: authenticateWithGoogle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or expired Google ID token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Email is not allowed to access the application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/users/me:
    get:
      tags: [ "Users" ]
      summary: Get the current authenticated user
      operationId: getCurrentUser
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: The current authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/users/me/theme-preference:
    patch:
      tags: [ "Users" ]
      summary: Update the current authenticated user's theme preference
      operationId: updateMyThemePreference
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateThemePreferenceRequest'
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/users:
    get:
      tags: [ "Users" ]
      summary: Get all users (admin only)
      operationId: getUsers
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: A list of all users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDto'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/users/{userId}/role:
    patch:
      tags: [ "Users" ]
      summary: Update another user's role (admin only)
      operationId: updateUserRole
      security:
        - bearerAuth: [ ]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleRequest'
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The authenticated user is not an admin, or the target user's role cannot be modified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/users/roles:
    patch:
      tags: [ "Users" ]
      summary: Update multiple users' roles at once (admin only)
      operationId: bulkUpdateUserRoles
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateUserRolesRequest'
      responses:
        '200':
          description: >-
            The users that were successfully updated. Users that don't exist, are the
            superadmin, or are the acting admin themselves are silently skipped rather than
            failing the whole batch.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDto'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The authenticated user is not an admin, or the requested role cannot be assigned in bulk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/army-collections:
    get:
      tags: [ "ArmyCollections" ]
      summary: Get all army collections
      operationId: getArmyCollections
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: A list of army collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArmyCollection'
              example:
                - id: "11111111-1111-1111-1111-111111111111"
                  name: "Starter Collection"
                  description: "An example collection"
                  isPublic: false
    post:
      tags: [ "ArmyCollections" ]
      summary: Create a new army collection
      operationId: createArmyCollection
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArmyCollection'
      responses:
        '201':
          description: Created army collections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArmyCollection'
  /api/v1/army-collections/public:
    get:
      tags: [ "ArmyCollections" ]
      summary: Get all public army collections
      operationId: getPublicArmyCollections
      security:
        - bearerAuth: [ ]
        - { }
      responses:
        '200':
          description: A list of public army collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArmyCollection'
              example:
                - id: "11111111-1111-1111-1111-111111111111"
                  userId: "22222222-2222-2222-2222-222222222222"
                  userDisplayName: "Keith"
                  name: "Starter Collection"
                  description: "An example collection"
                  isPublic: true
  /api/v1/army-collections/order:
    patch:
      tags: [ "ArmyCollections" ]
      summary: Reorder the current user's army collections (drag-to-reorder on the Collections page)
      operationId: reorderArmyCollections
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderArmyCollectionsRequest'
      responses:
        '200':
          description: The army collections in their new order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArmyCollection'
        '400':
          description: The given ids don't match exactly the user's existing army collection ids
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/army-collections/{armyCollectionId}:
    get:
      tags: [ "ArmyCollections" ]
      summary: Get a single army collection
      operationId: getArmyCollection
      security:
        - bearerAuth: [ ]
      parameters:
        - name: armyCollectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The army collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArmyCollection'
        '404':
          description: Army collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      tags: [ "ArmyCollections" ]
      summary: Rename/update an army collection
      operationId: updateArmyCollection
      security:
        - bearerAuth: [ ]
      parameters:
        - name: armyCollectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateArmyCollectionRequest'
      responses:
        '200':
          description: The updated army collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArmyCollection'
        '404':
          description: Army collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/army-collections/{armyCollectionId}/model-definition-order:
    patch:
      tags: [ "ArmyCollections" ]
      summary: >-
        Reorder the model-definition groups (accordion sections) shown within an army collection's
        model list
      operationId: reorderModelDefinitionGroups
      security:
        - bearerAuth: [ ]
      parameters:
        - name: armyCollectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderModelDefinitionGroupsRequest'
      responses:
        '200':
          description: The updated army collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArmyCollection'
        '404':
          description: Army collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/model-definitions:
    get:
      tags: [ "ModelDefinitions" ]
      summary: Get all available model types (e.g. Poxwalker)
      description: >-
        Open to anonymous callers for preview mode. When a bearer token is present, any shared
        definition the user has customised is replaced by their own version and their
        from-scratch definitions are included, so this is the catalogue as that user sees it.
      operationId: getModelDefinitions
      responses:
        '200':
          description: A list of model definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelDefinition'
  /api/v1/wargear-definitions:
    get:
      tags: [ "PersonalModelDefinitions" ]
      summary: List the wargear the signed-in user can attach to a personal model definition
      description: The shared catalogue plus any wargear this user created for their own definitions.
      operationId: getAvailableWargearDefinitions
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: The wargear available to this user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WargearDefinition'
  /api/v1/my/model-definitions:
    get:
      tags: [ "PersonalModelDefinitions" ]
      summary: List the signed-in user's own model definitions
      description: >-
        Both kinds of personal definition: customisations of a shared definition (which carry a
        baseModelDefinitionId) and ones the user wrote from scratch (which do not).
      operationId: getMyModelDefinitions
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: This user's model definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelDefinition'
    post:
      tags: [ "PersonalModelDefinitions" ]
      summary: Create a model definition of the user's own
      operationId: createMyModelDefinition
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertModelDefinitionDraftRequest'
      responses:
        '201':
          description: The created definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDefinition'
  /api/v1/my/model-definitions/shared:
    get:
      tags: [ "PersonalModelDefinitions" ]
      summary: List the shared catalogue without the signed-in user's customisations
      description: >-
        GET /api/v1/model-definitions returns the shared catalogue and the user's own definitions
        together, so a customisation appears alongside the definition it was forked from. This
        endpoint returns the shared definitions on their own: to offer them for customisation, and
        to diff a personal copy against the definition it came from.
      operationId: getSharedModelDefinitions
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: The shared model definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelDefinition'
  /api/v1/my/model-definitions/{modelDefinitionId}:
    put:
      tags: [ "PersonalModelDefinitions" ]
      summary: Replace the full contents of one of the user's own model definitions
      operationId: updateMyModelDefinition
      security:
        - bearerAuth: [ ]
      parameters:
        - name: modelDefinitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertModelDefinitionDraftRequest'
      responses:
        '200':
          description: The updated definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDefinition'
        '404':
          description: No such definition belongs to this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [ "PersonalModelDefinitions" ]
      summary: Delete one of the user's own model definitions, reverting to the shared one if it was a customisation
      operationId: deleteMyModelDefinition
      security:
        - bearerAuth: [ ]
      parameters:
        - name: modelDefinitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The definition was deleted
        '404':
          description: No such definition belongs to this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The user's collection still references this definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/my/model-definitions/from/{modelDefinitionId}:
    post:
      tags: [ "PersonalModelDefinitions" ]
      summary: Start customising a shared model definition
      description: >-
        Copies the shared definition, its slots and its wargear options into a personal definition
        owned by the caller, which is then listed alongside the original wherever they see the
        catalogue. Idempotent - returns the existing customisation if they already have one.
      operationId: customiseModelDefinition
      security:
        - bearerAuth: [ ]
      parameters:
        - name: modelDefinitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The personal copy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelDefinition'
        '400':
          description: The given definition is not a shared one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Model definition not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/my/factions:
    get:
      tags: [ "PersonalFactions" ]
      summary: List the signed-in user's own factions
      description: >-
        Both kinds of personal faction: customisations of a shared faction (which carry a
        baseFactionId) and ones the user created from scratch (which do not).
      operationId: getMyFactions
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: This user's factions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Faction'
    post:
      tags: [ "PersonalFactions" ]
      summary: Create a faction of the user's own
      operationId: createMyFaction
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFactionRequest'
      responses:
        '201':
          description: The created faction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Faction'
        '409':
          description: The user already has a faction with that name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/my/factions/shared:
    get:
      tags: [ "PersonalFactions" ]
      summary: List the shared factions on their own
      description: >-
        GET /api/v1/factions returns the shared factions and the user's own together. This endpoint
        returns the shared ones alone: to offer them for customisation, and to diff a personal copy
        against the faction it was forked from.
      operationId: getSharedFactions
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: The shared factions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Faction'
  /api/v1/my/factions/{factionId}:
    put:
      tags: [ "PersonalFactions" ]
      summary: Update one of the user's own factions
      operationId: updateMyFaction
      security:
        - bearerAuth: [ ]
      parameters:
        - name: factionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFactionRequest'
      responses:
        '200':
          description: The updated faction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Faction'
        '404':
          description: No such faction belongs to this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The user already has a faction with that name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [ "PersonalFactions" ]
      summary: Delete one of the user's own factions, reverting to the shared one if it was a customisation
      operationId: deleteMyFaction
      security:
        - bearerAuth: [ ]
      parameters:
        - name: factionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The faction was deleted
        '404':
          description: No such faction belongs to this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Model definitions still belong to this faction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/my/factions/from/{factionId}:
    post:
      tags: [ "PersonalFactions" ]
      summary: Start customising a shared faction
      description: >-
        Copies the shared faction into one owned by the caller, which is then listed alongside the
        original. Idempotent - returns the existing customisation if they already have one.
      operationId: customiseFaction
      security:
        - bearerAuth: [ ]
      parameters:
        - name: factionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The personal copy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Faction'
        '400':
          description: The given faction is not a shared one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Faction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/my/wargear-definitions:
    get:
      tags: [ "PersonalWargearDefinitions" ]
      summary: List the signed-in user's own wargear
      description: >-
        Both kinds of personal wargear: customisations of shared wargear (which carry a
        baseWargearDefinitionId) and wargear the user named themselves, including anything created
        implicitly by naming wargear on a personal model definition.
      operationId: getMyWargearDefinitions
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: This user's wargear
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WargearDefinition'
    post:
      tags: [ "PersonalWargearDefinitions" ]
      summary: Create wargear of the user's own
      operationId: createMyWargearDefinition
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWargearDefinitionRequest'
      responses:
        '201':
          description: The created wargear
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WargearDefinition'
        '409':
          description: The user already has wargear with that name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/my/wargear-definitions/shared:
    get:
      tags: [ "PersonalWargearDefinitions" ]
      summary: List the shared wargear on its own
      description: >-
        GET /api/v1/wargear-definitions returns the shared catalogue and the user's own together.
        This endpoint returns the shared wargear alone: to offer it for customisation, and to diff a
        personal copy against the wargear it was forked from.
      operationId: getSharedWargearDefinitions
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: The shared wargear
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WargearDefinition'
  /api/v1/my/wargear-definitions/{wargearDefinitionId}:
    put:
      tags: [ "PersonalWargearDefinitions" ]
      summary: Rename one of the user's own wargear definitions
      operationId: updateMyWargearDefinition
      security:
        - bearerAuth: [ ]
      parameters:
        - name: wargearDefinitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWargearDefinitionRequest'
      responses:
        '200':
          description: The updated wargear
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WargearDefinition'
        '404':
          description: No such wargear belongs to this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: The user already has wargear with that name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [ "PersonalWargearDefinitions" ]
      summary: Delete one of the user's own wargear definitions
      operationId: deleteMyWargearDefinition
      security:
        - bearerAuth: [ ]
      parameters:
        - name: wargearDefinitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The wargear was deleted
        '404':
          description: No such wargear belongs to this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Model definition options still reference this wargear
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/my/wargear-definitions/from/{wargearDefinitionId}:
    post:
      tags: [ "PersonalWargearDefinitions" ]
      summary: Start customising a shared wargear definition
      description: >-
        Copies the shared wargear into one owned by the caller, which they can then rename and
        attach to their own model definitions. Idempotent - returns the existing customisation if
        they already have one.
      operationId: customiseWargearDefinition
      security:
        - bearerAuth: [ ]
      parameters:
        - name: wargearDefinitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The personal copy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WargearDefinition'
        '400':
          description: The given wargear is not shared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Wargear definition not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/factions:
    get:
      tags: [ "ModelDefinitions" ]
      summary: >-
        List all factions. Used to group model types for browsing/selection - factions carry
        no army-building rules, purely catalogue organisation.
      operationId: getFactionsList
      responses:
        '200':
          description: A list of all factions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Faction'
  /api/v1/admin/factions:
    get:
      tags: [ "FactionDefinitionAdmin" ]
      summary: >-
