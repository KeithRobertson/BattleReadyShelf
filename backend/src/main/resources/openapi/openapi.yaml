openapi: 3.0.3
info:
  title: BattleReadyShelf API
  version: 0.1.0
  description: BattleReadyShelf API
servers:
  - url: /
paths:
  /api/v1/auth/google:
    post:
      tags: [ "Auth" ]
      summary: Authenticate with a Google ID token
      operationId: authenticateWithGoogle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or expired Google ID token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Email is not allowed to access the application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/users/me:
    get:
      tags: [ "Users" ]
      summary: Get the current authenticated user
      operationId: getCurrentUser
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: The current authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/army-collections:
    get:
      tags: [ "ArmyCollections" ]
      summary: Get all army collections
      operationId: getArmyCollections
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: A list of army collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArmyCollection'
              example:
                - id: "11111111-1111-1111-1111-111111111111"
                  name: "Starter Collection"
                  description: "An example collection"
    post:
      tags: [ "ArmyCollections" ]
      summary: Create a new army collection
      operationId: createArmyCollection
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArmyCollection'
      responses:
        '201':
          description: Created army collections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArmyCollection'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      properties:
        message:
          type: string
      required: [ message ]
    ArmyCollection:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        description:
          type: string
      required: [ name ]
    GoogleAuthRequest:
      type: object
      properties:
        idToken:
          type: string
      required: [ idToken ]
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserDto'
      required: [ token, user ]
    UserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
      required: [ id, email ]
