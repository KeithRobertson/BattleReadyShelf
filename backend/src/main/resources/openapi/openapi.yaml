      security:
        - bearerAuth: [ ]
      parameters:
        - name: factionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The faction was deleted
        '403':
          description: The authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Faction not found
  /api/v1/admin/factions/drafts:
    get:
      tags: [ "FactionDefinitionAdmin" ]
