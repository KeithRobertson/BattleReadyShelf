        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelDefinitionExport'
      responses:
        '200':
          description: >-
            The drafts created or updated by the import. Definitions that were already up to date
            are omitted, so an unchanged re-import returns an empty array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelDefinitionDraft'
        '400':
          description: The document's schemaVersion is not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: The authenticated user is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/army-collections/{armyCollectionId}/models:
    get:
      tags: [ "CollectionModels" ]
      summary: Get all models in an army collection
      operationId: getCollectionModels
      security:
        - bearerAuth: [ ]
      parameters:
        - name: armyCollectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A list of models in the army collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionModel'
        '404':
          description: Army collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      tags: [ "CollectionModels" ]
      summary: Add a new model to an army collection
      operationId: createCollectionModel
      security:
        - bearerAuth: [ ]
      parameters:
        - name: armyCollectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionModel'
      responses:
        '201':
          description: The created collection model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionModel'
        '404':
          description: Army collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/army-collections/{armyCollectionId}/models/bulk:
    post:
      tags: [ "CollectionModels" ]
      summary: Add many models of a single model definition to an army collection at once
      operationId: bulkCreateCollectionModels
      security:
        - bearerAuth: [ ]
      parameters:
        - name: armyCollectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCreateCollectionModelsRequest'
      responses:
        '201':
          description: The created collection models (unnamed; name them individually afterwards)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionModel'
        '404':
          description: Army collection or model definition not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/collection-models/{collectionModelId}:
    patch:
      tags: [ "CollectionModels" ]
      summary: Rename/update a collection model
      operationId: updateCollectionModel
      security:
        - bearerAuth: [ ]
      parameters:
        - name: collectionModelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCollectionModelRequest'
      responses:
        '200':
          description: The updated collection model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionModel'
        '404':
          description: Collection model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [ "CollectionModels" ]
      summary: Delete a collection model (and its images)
      operationId: deleteCollectionModel
      security:
        - bearerAuth: [ ]
      parameters:
        - name: collectionModelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The collection model was deleted
        '404':
          description: Collection model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/army-collections/{armyCollectionId}/models/bulk-delete:
    post:
      tags: [ "CollectionModels" ]
      summary: Delete many collection models (and their images) at once
      operationId: bulkDeleteCollectionModels
      security:
        - bearerAuth: [ ]
      parameters:
        - name: armyCollectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteCollectionModelsRequest'
      responses:
        '204':
          description: >-
            The collection models that exist and belong to this army collection were deleted;
            others were silently skipped.
        '404':
          description: Army collection not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/collection-models/{collectionModelId}/model-definition-change-preview:
    post:
      tags: [ "CollectionModels" ]
      summary: Preview what changing a collection model's definition would do to its wargear
      description: >-
        A read-only dry run. Nothing is persisted; the result describes how each existing wargear
        assignment would be remapped onto the target definition's slots.
      operationId: previewModelDefinitionChange
      security:
        - bearerAuth: [ ]
      parameters:
        - name: collectionModelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeModelDefinitionPreviewRequest'
      responses:
        '200':
          description: What the change would do
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeModelDefinitionPreview'
        '404':
          description: Collection model or model definition not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/collection-models/{collectionModelId}/images:
    post:
      tags: [ "CollectionModelImages" ]
      summary: Request a presigned URL to upload a new image for a collection model
      operationId: createCollectionModelImageUploadUrl
      security:
        - bearerAuth: [ ]
      parameters:
        - name: collectionModelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionModelImageUploadRequest'
      responses:
        '201':
          description: The created image record and a presigned upload URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionModelImageUploadResponse'
        '400':
          description: Invalid content type, file too large, or uploads disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Collection model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /api/v1/collection-models/{collectionModelId}/images/{imageId}:
    delete:
      tags: [ "CollectionModelImages" ]
      summary: Delete an image attached to a collection model
      operationId: deleteCollectionModelImage
      security:
        - bearerAuth: [ ]
      parameters:
        - name: collectionModelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Image deleted
        '404':
          description: Collection model or image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      properties:
        message:
          type: string
      required: [ message ]
    ArmyCollection:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        userId:
          type: string
          format: uuid
          readOnly: true
          description: The user ID of the owner of this collection.
        userDisplayName:
          type: string
          readOnly: true
          description: Display name of the user who owns this collection.
        name:
          type: string
        description:
          type: string
        isPublic:
          type: boolean
          description: Whether this collection is publicly viewable. Defaults to false.
        modelCount:
          type: integer
          format: int32
          readOnly: true
          description: Total number of collection models in this army collection.
        modelCountsByStatus:
          type: object
          readOnly: true
          description: >-
            Number of collection models in this army collection per status. Statuses with no
            models are omitted.
          additionalProperties:
            type: integer
            format: int32
        modelDefinitionOrder:
          type: array
          readOnly: true
          description: >-
            The user's chosen display order of model-definition groups (accordion sections) within
            this collection, as model definition ids. Only definitions the user has explicitly
            reordered are listed here; any other groups present in the collection should be shown
            after these, in alphabetical order.
          items:
            type: string
            format: uuid
      required: [ name ]
    UpdateArmyCollectionRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        isPublic:
          type: boolean
    ReorderArmyCollectionsRequest:
      type: object
      properties:
        armyCollectionIds:
          type: array
          description: >-
            All of the current user's army collection ids, in the desired display order. Must be
            exactly the set of the user's existing army collection ids.
          items:
            type: string
            format: uuid
      required: [ armyCollectionIds ]
    ReorderModelDefinitionGroupsRequest:
      type: object
      properties:
        modelDefinitionIds:
          type: array
          description: The model definition ids present in this collection, in the desired display order.
          items:
            type: string
            format: uuid
      required: [ modelDefinitionIds ]
    ModelDefinition:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        externalId:
          type: string
          readOnly: true
          description: >-
            Stable identifier from an imported reference dataset (e.g. battlereadyshelf-data),
            used to match this definition across re-imports. Null for definitions created directly
            in the admin UI rather than via import.
        factionId:
          type: string
          format: uuid
          readOnly: true
          description: The faction this model belongs to, if any.
        ownerUserId:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: >-
            Null for the shared catalogue that admins curate. Set when this is a user's own model
            definition, which only they can see or edit.
        baseModelDefinitionId:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: >-
            The shared definition a personal one was customised from, or null when the user wrote
            it from scratch. Drives the personal-vs-global diff and the revert action.
        name:
          type: string
        description:
          type: string
        version:
          type: integer
          format: int32
          readOnly: true
          description: Incremented every time this model definition is published.
        attachmentSlots:
          readOnly: true
          type: array
          description: >-
            Slots on this model (e.g. "Left Arm", "Right Arm") that can be filled with wargear.
          items:
            $ref: '#/components/schemas/AttachmentSlot'
        wargearOptions:
          readOnly: true
          type: array
          description: >-
            Known wargear options for this model, and which slot(s) each one fills. This is not
            an exhaustive/enforced list - it exists to describe common/default loadouts.
          items:
            $ref: '#/components/schemas/WargearOption'
      required: [ name ]
    Faction:
      type: object
      description: >-
        Categorises model definitions for catalogue organisation/filtering only - it carries no
        army-building rules (legality, availability, inclusion/exclusion, points, etc.).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        externalId:
          type: string
          nullable: true
          description: >-
            Stable identifier used to match this faction across imports. Null for a faction a user
            created for themselves, which the reference dataset knows nothing about.
        name:
          type: string
        parentFactionId:
          type: string
          format: uuid
          nullable: true
          description: Null if this faction has no parent.
        ownerUserId:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: >-
            Null for the shared catalogue. Set on a faction a user added or customised for
            themselves, in which case only they can see it.
        baseFactionId:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: >-
            The shared faction this personal one was forked from, so the app can show how it
            differs and offer to revert. Null both for shared factions and for ones a user invented.
      required: [id, name ]
    AttachmentSlot:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        externalId:
          type: string
          readOnly: true
          description: Stable identifier from an imported reference dataset, if this slot was created/matched via import.
        baseAttachmentSlotId:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: >-
            On a personal model definition, the shared slot this one was customised from. Lets a
            renamed slot read as an edit rather than an unrelated add plus remove.
        name:
          type: string
        type:
          type: string
          description: Stable machine-readable category for this physical attachment slot.
      required: [ name, type ]
    WargearOption:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        externalId:
          type: string
          readOnly: true
          description: Stable identifier from an imported reference dataset, if this option's wargear came from one.
        baseWargearOptionId:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: >-
            On a personal model definition, the shared wargear option this one was customised from.
        wargearDefinitionId:
          type: string
          format: uuid
          readOnly: true
          description: The shared wargear definition this option refers to.
        name:
          type: string
          readOnly: true
          description: Resolved from the shared wargear definition; edit it there to rename it everywhere.
        isDefault:
          type: boolean
          description: Whether this option is part of the model's default loadout.
        attachmentSlotIds:
          type: array
          description: >-
            The slot(s) this wargear option fills. An option filling more than one slot (e.g. a
            two-handed weapon) consumes all of those slots at once.
          items:
            type: string
            format: uuid
      required: [ name, isDefault, attachmentSlotIds ]
    ModelDefinitionDraft:
      type: object
      description: An admin's in-progress edit of a model definition, not visible to regular users.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        publishedModelDefinitionId:
          type: string
          format: uuid
          readOnly: true
          description: Null if this draft has never been published (a brand-new model definition).
        externalId:
          type: string
          readOnly: true
          description: Stable identifier from an imported reference dataset, if this draft was created/updated via import.
        factionId:
          type: string
          format: uuid
          readOnly: true
          description: The faction this model belongs to, if set via import.
        name:
          type: string
        description:
          type: string
        attachmentSlots:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentSlotDraft'
        wargearOptions:
          type: array
          items:
            $ref: '#/components/schemas/WargearOptionDraft'
        createdBy:
          type: string
          format: uuid
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedBy:
          type: string
          format: uuid
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required: [ name, attachmentSlots, wargearOptions ]
    AttachmentSlotDraft:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        publishedAttachmentSlotId:
          type: string
          format: uuid
          readOnly: true
          description: Null if this slot is new and has never been published.
        externalId:
          type: string
          readOnly: true
          description: Stable identifier from an imported reference dataset, if this slot was created/matched via import.
        name:
          type: string
        type:
          type: string
          description: Stable machine-readable category for this physical attachment slot.
      required: [ name, type ]
    WargearOptionDraft:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        publishedWargearOptionId:
          type: string
          format: uuid
          readOnly: true
          description: Null if this option is new and has never been published.
        externalId:
          type: string
          readOnly: true
          description: Stable identifier from an imported reference dataset, if this option's wargear came from one.
        wargearDefinitionId:
          type: string
          format: uuid
          readOnly: true
          description: The shared wargear definition this option refers to.
        name:
          type: string
          readOnly: true
          description: Resolved from the shared wargear definition; edit it there to rename it everywhere.
        isDefault:
          type: boolean
        attachmentSlotIds:
          type: array
          description: The draft attachment slot id(s) this option fills.
          items:
            type: string
            format: uuid
      required: [ name, isDefault, attachmentSlotIds ]
    UpsertModelDefinitionDraftRequest:
      type: object
      description: >-
        Full replacement of a draft's contents. Attachment slots and wargear options that already
        exist in the draft should be sent with their existing draft id so they are updated in
        place; new ones should have a client-generated id (a fresh random UUID) so wargear options
        in the same request can reference them by that id. Any existing slot/option not present in
        the request is removed from the draft.
      properties:
        name:
          type: string
        faction_id:
          type: string
          format: uuid
          description: The faction this model belongs to
        description:
          type: string
        attachmentSlots:
          type: array
          items:
            $ref: '#/components/schemas/UpsertAttachmentSlotDraftRequest'
        wargearOptions:
          type: array
          items:
            $ref: '#/components/schemas/UpsertWargearOptionDraftRequest'
      required: [ name, attachmentSlots, wargearOptions ]
    UpsertAttachmentSlotDraftRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The draft slot id (existing, or a freshly client-generated one for a new slot).
        name:
          type: string
        type:
          type: string
          description: Stable machine-readable category for this physical attachment slot.
      required: [ id, name, type ]
    UpsertWargearOptionDraftRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The draft option id (existing, or a freshly client-generated one for a new option).
        wargearDefinitionId:
          type: string
          format: uuid
          description: >-
            The shared wargear definition to point at. Takes precedence over 'name' when both are
            sent; when omitted, the definition is looked up by name and created if it does not
            exist yet.
        name:
          type: string
          description: >-
            Used to resolve or create the shared wargear definition when 'wargearDefinitionId' is
            not supplied. Renaming here creates/points at a different definition rather than
            renaming the existing one - rename via the wargear definition itself.
        isDefault:
          type: boolean
        attachmentSlotIds:
          type: array
          items:
            type: string
            format: uuid
      required: [ id, name, isDefault, attachmentSlotIds ]
    WargearDefinition:
      type: object
      description: >-
        A canonical piece of wargear shared by every model definition that can be equipped with it,
        so it is named once rather than copied per model. Ids form a single global namespace
        because the reference dataset already reuses them across factions.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        externalId:
          type: string
          readOnly: true
          description: Stable identifier from the reference dataset; null for wargear created by hand.
        ownerUserId:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: >-
            Null for the shared catalogue. Set when a user named wargear the catalogue doesn't
            have while building a personal model definition, in which case only they can see it.
        name:
          type: string
        baseWargearDefinitionId:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: >-
            The shared wargear this personal one was forked from, so the app can show how it
            differs and offer to revert. Null both for shared wargear and for wargear a user
            named themselves.
        usageCount:
          type: integer
          format: int32
          readOnly: true
          description: How many published model definitions currently reference this wargear.
      required: [ name ]
    UpdateWargearDefinitionRequest:
      type: object
      properties:
        name:
          type: string
      required: [ name ]
    WargearDefinitionDraft:
      type: object
      description: >-
        A wargear name change that has been proposed but not yet applied. Renames are never
        applied directly, because one definition backs every model definition using it - the
        change is staged here for an admin to accept or reject.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        wargearDefinitionId:
          type: string
          format: uuid
          readOnly: true
        externalId:
          type: string
          readOnly: true
          description: Stable identifier from the reference dataset, if this wargear came from one.
        currentName:
          type: string
          readOnly: true
          description: The name stored today, which stays in effect unless this change is accepted.
        proposedName:
          type: string
          readOnly: true
          description: The name that would be applied.
        usageCount:
          type: integer
          format: int32
          readOnly: true
          description: How many published model definitions the rename would affect.
        origin:
          $ref: '#/components/schemas/ProposalOrigin'
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required: [ currentName, proposedName ]
    ProposalOrigin:
      type: string
      readOnly: true
      description: Where a pending change came from, so a review can weigh an import against a hand edit.
      enum: [ IMPORT, ADMIN ]
    UpdateFactionRequest:
      type: object
      description: >-
        The complete proposed state of a faction. An omitted or null parentFactionId proposes
        clearing the parent rather than leaving it alone.
      properties:
        name:
          type: string
        parentFactionId:
          type: string
          format: uuid
          nullable: true
      required: [ name ]
    FactionDraft:
      type: object
      description: >-
        A faction change that has been proposed but not yet applied. A faction groups every model
        definition beneath it, so renaming or reparenting one is staged here for an admin to
        accept or reject. The draft carries the complete proposed state: a null
        proposedParentFactionId proposes clearing the parent.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        factionId:
          type: string
          format: uuid
          readOnly: true
        externalId:
          type: string
          readOnly: true
          description: Stable identifier from the reference dataset, if this faction came from one.
        currentName:
          type: string
          readOnly: true
          description: The name stored today, which stays in effect unless this change is accepted.
        proposedName:
          type: string
          readOnly: true
        currentParentFactionId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        proposedParentFactionId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        usageCount:
          type: integer
          format: int32
          readOnly: true
          description: How many published model definitions sit under this faction.
        origin:
          $ref: '#/components/schemas/ProposalOrigin'
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required: [ currentName, proposedName ]
    DefinitionPublishAudit:
      type: object
      description: >-
        An immutable record of one accepted change to a faction or wargear definition, holding
        the state either side of the publish so the history reads as a diff. Model definitions
        keep their own richer audit trail.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        definitionId:
          type: string
          format: uuid
          readOnly: true
        publishedBy:
          type: string
          format: uuid
          readOnly: true
        publishedAt:
          type: string
          format: date-time
          readOnly: true
        origin:
          $ref: '#/components/schemas/ProposalOrigin'
        previousState:
          type: string
          readOnly: true
          description: A JSON snapshot of the definition immediately before this publish.
        newState:
          type: string
          readOnly: true
          description: A JSON snapshot of the definition immediately after this publish.
    PublishModelDefinitionDraftRequest:
      type: object
      properties:
        changeSummary:
          type: string
          description: Optional admin-supplied note describing what changed, stored in the audit trail.
    ModelDefinitionPublishAuditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        modelDefinitionId:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          format: int32
          readOnly: true
        publishedBy:
          type: string
          format: uuid
          readOnly: true
        publishedAt:
          type: string
          format: date-time
          readOnly: true
        changeSummary:
          type: string
          readOnly: true
        snapshot:
          type: string
          readOnly: true
          description: A JSON snapshot of the published model definition immediately after this publish.
    ModelDefinitionExport:
      type: object
      description: >-
        A versioned, portable catalogue of model definitions. Its items use the same field names
        and shapes as the source JSON files assembled by battlereadyshelf-dataset.

        Factions and wargear are exported and imported separately, from their own admin pages,
        so this document references them by id and does not define them.
      properties:
        schemaVersion:
          type: integer
          format: int32
          description: The version of this export document's schema, incremented on breaking changes.
        exportedAt:
          type: string
          format: date-time
          readOnly: true
        datasetVersion:
          type: integer
          format: int32
          description: Optional version of the source dataset assembled into this document.
        factions:
          type: array
          deprecated: true
          description: >-
            Deprecated: import factions from the Manage Factions page instead. Older combined
            catalogues carry them here, and those are still upserted on import so an existing
            document keeps working. Exports no longer emit this.
          items:
            $ref: '#/components/schemas/FactionExportItem'
        wargear:
          type: array
          deprecated: true
          description: >-
            Deprecated: import wargear from the Manage Wargear Definitions page instead. Older
            combined catalogues carry them here, and those are still honoured on import so an
            existing document keeps working. Exports no longer emit this.
          items:
            $ref: '#/components/schemas/WargearExportItem'
        modelDefinitions:
          type: array
          items:
            $ref: '#/components/schemas/ModelDefinitionExportItem'
      required: [ schemaVersion, modelDefinitions ]
    FactionExport:
      type: object
      description: >-
        A versioned, portable catalogue of factions. New factions are created outright on import;
        changes to existing ones are staged for review.
      properties:
        schemaVersion:
          type: integer
          format: int32
          description: The version of this export document's schema, incremented on breaking changes.
        exportedAt:
          type: string
          format: date-time
          readOnly: true
        datasetVersion:
          type: integer
          format: int32
          description: Optional version of the source dataset assembled into this document.
        factions:
          type: array
          items:
            $ref: '#/components/schemas/FactionExportItem'
      required: [ schemaVersion, factions ]
    FactionImportResult:
      type: object
      description: >-
        What a faction import did. Changes to existing factions are proposed rather than applied,
        so 'pendingChanges' is the list an admin still has to accept or reject. Factions already
        matching the document are counted as unchanged, so re-importing the same document reports
        nothing to review.
      properties:
        created:
          type: array
          description: Factions the catalogue did not have, added outright.
          items:
            $ref: '#/components/schemas/Faction'
        pendingChanges:
          type: array
          description: Changes raised for review because the stored faction differs from the document's.
          items:
            $ref: '#/components/schemas/FactionDraft'
        unchanged:
          type: integer
          format: int32
      required: [ created, pendingChanges, unchanged ]
    WargearDefinitionExport:
      type: object
      description: >-
        A versioned, portable catalogue of shared wargear, naming each item once for every model
        definition that references it.
      properties:
        schemaVersion:
          type: integer
          format: int32
          description: The version of this export document's schema, incremented on breaking changes.
        exportedAt:
          type: string
          format: date-time
          readOnly: true
        datasetVersion:
          type: integer
          format: int32
          description: Optional version of the source dataset assembled into this document.
        wargear:
          type: array
          items:
            $ref: '#/components/schemas/WargearExportItem'
      required: [ schemaVersion, wargear ]
    WargearImportResult:
      type: object
      description: >-
        What a wargear import did. Renames are proposed rather than applied, so 'pendingChanges'
        is the list an admin still has to accept or reject.
      properties:
        created:
          type: array
          description: Wargear the catalogue did not have, added outright.
          items:
            $ref: '#/components/schemas/WargearDefinition'
        pendingChanges:
          type: array
          description: Renames raised for review because the stored name differs from the document's.
          items:
            $ref: '#/components/schemas/WargearDefinitionDraft'
        unchanged:
          type: integer
          format: int32
      required: [ created, pendingChanges, unchanged ]
    WargearExportItem:
      type: object
      properties:
        id:
          type: string
          description: >-
            Stable identifier used to match this wargear across imports, and referenced by
            each model definition's wargear options. Exports of hand-authored wargear emit
            the persisted UUID instead.
        name:
          type: string
      required: [ id, name ]
    FactionExportItem:
      type: object
      properties:
        id:
          type: string
          description: Stable identifier used to match this faction across imports.
        name:
          type: string
        parentFactionId:
          type: string
          description: The id of the parent faction (from this same 'factions' list), if any.
      required: [ id, name ]
    ModelDefinitionExportItem:
      type: object
      properties:
        id:
          type: string
          description: >-
            Stable identifier used to match this model definition across imports (e.g. from the
            battlereadyshelf-dataset reference repository), instead of matching by name.
            Exports of hand-authored definitions emit the persisted UUID instead.
        factionId:
          type: string
          nullable: true
          description: >-
            The id of the faction (from this document's 'factions' list) this model
            belongs to. Optional - null if this model is not categorised under any faction.
        name:
          type: string
        description:
          type: string
        attachmentSlots:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: >-
                  Stable identifier used to match this slot across imports.
                  Exports of hand-authored slots emit the persisted UUID instead.
              name:
                type: string
              type:
                type: string
                description: Stable machine-readable category for this physical attachment slot.
            required: [ id, name, type ]
        wargearOptions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: >-
                  Stable identifier used to match this option across imports.
                  Exports of hand-authored options emit the persisted UUID instead.
              name:
                type: string
                description: >-
                  Deprecated, and absent from schemaVersion 4 documents: wargear names now
                  live in the document's top-level 'wargear' catalogue. Still accepted from
                  older documents, where it names the wargear this option refers to.
              isDefault:
                type: boolean
              slotIds:
                type: array
                description: The id(s) of the attachment slot(s), from this same item, this option fills.
                items:
                  type: string
            required: [ id, isDefault, slotIds ]
      required: [ id, factionId, name, attachmentSlots, wargearOptions ]
    CollectionModelImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        contentType:
          type: string
          readOnly: true
          description: The content type of the large (~1600px) rendition.
        sizeBytes:
          type: integer
          format: int64
          readOnly: true
          description: The size in bytes of the large (~1600px) rendition.
        thumbnailUrl:
          type: string
          format: uri
          readOnly: true
          description: A short-lived presigned URL for a small (~300px) thumbnail rendition, for use in list/grid views.
        largeUrl:
          type: string
          format: uri
          readOnly: true
          description: A short-lived presigned URL for a large (~1600px) rendition, for use in detail views.
    ImageVariantUploadRequest:
      type: object
      properties:
        contentType:
          type: string
          example: "image/jpeg"
        contentLengthBytes:
          type: integer
          format: int64
      required: [ contentType, contentLengthBytes ]
    CollectionModelImageUploadRequest:
      type: object
      properties:
        large:
          $ref: '#/components/schemas/ImageVariantUploadRequest'
        thumbnail:
          $ref: '#/components/schemas/ImageVariantUploadRequest'
      required: [ large, thumbnail ]
    ImageVariantUploadUrls:
      type: object
      description: >-
        Short-lived presigned URLs. PUT the raw bytes for each rendition here with a matching
        Content-Type header.
      properties:
        large:
          type: string
          format: uri
        thumbnail:
          type: string
          format: uri
      required: [ large, thumbnail ]
    CollectionModelImageUploadResponse:
      type: object
      properties:
        image:
          $ref: '#/components/schemas/CollectionModelImage'
        uploadUrls:
          $ref: '#/components/schemas/ImageVariantUploadUrls'
      required: [ image, uploadUrls ]
    CollectionModel:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        modelDefinitionId:
          type: string
          format: uuid
        modelDefinition:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/ModelDefinition'
        name:
          type: string
        description:
          type: string
        finishedOn:
          type: string
          format: date
          description: The date the model was finished being painted, if known.
        status:
          allOf:
            - $ref: '#/components/schemas/CollectionModelStatus'
        images:
          readOnly: true
          type: array
          items:
            $ref: '#/components/schemas/CollectionModelImage'
        wargearSelections:
          readOnly: true
          type: array
          description: >-
            What the user has assigned to each of this model's attachment slots, if any.
          items:
            $ref: '#/components/schemas/WargearSelection'
      required: [ modelDefinitionId ]
    WargearSelection:
      type: object
      properties:
        attachmentSlotId:
          type: string
          format: uuid
        wargearOptionId:
          type: string
          format: uuid
          description: The wargear option assigned to this slot, or null/omitted to leave it empty.
        customLabel:
          type: string
          description: >-
            A free-text wargear name for this slot when nothing in the model definition's
            recognised wargear options matches what the user actually modeled (e.g. a
            conversion). Mutually exclusive with wargearOptionId: setting both on the same
            selection is rejected. Custom labels are personal to this collection model and are
            not considered by army list validation.
      required: [ attachmentSlotId ]
    CollectionModelStatus:
      type: string
      description: >-
        A collection model's progress through the typical painting pipeline.
      enum: [ BOXED, ASSEMBLING, ASSEMBLED, PRIMING, PRIMED, PAINTING, PAINTED ]
    BulkCreateCollectionModelsRequest:
      type: object
      properties:
        modelDefinitionId:
          type: string
          format: uuid
        count:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
        status:
          allOf:
            - $ref: '#/components/schemas/CollectionModelStatus'
      required: [ modelDefinitionId, count ]
    BulkDeleteCollectionModelsRequest:
      type: object
      properties:
        collectionModelIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
      required: [ collectionModelIds ]
    UpdateCollectionModelRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        finishedOn:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/CollectionModelStatus'
        modelDefinitionId:
          type: string
          format: uuid
          description: >-
            Changes which model definition this model is an instance of (e.g. moving it onto your
            own customised version). Existing wargear assignments are remapped onto the new
            definition's slots by name; anything that cannot be matched is kept as a custom label,
            and anything whose slot no longer exists is discarded. Call the change preview endpoint
            first to see exactly what will happen. Omit to leave the model definition unchanged.
        wargearSelections:
          type: array
          description: >-
            If present, replaces all of this model's wargear slot assignments. Omit to leave
            existing assignments unchanged. Ignored when modelDefinitionId is also supplied, since
            the assignments are being remapped onto a different definition's slots.
          items:
            $ref: '#/components/schemas/WargearSelection'
    ChangeModelDefinitionPreviewRequest:
      type: object
      properties:
        modelDefinitionId:
          type: string
          format: uuid
      required: [ modelDefinitionId ]
    WargearRemapOutcome:
      type: string
      description: >-
        What will happen to one existing wargear assignment if the model definition changes.
        MATCHED - an equivalent wargear option exists on the new definition and will be used.
        CUSTOM - the slot survives but nothing matches, so the name is kept as free text.
        DROPPED - the new definition has no equivalent slot, so the assignment is discarded.
      enum: [ MATCHED, CUSTOM, DROPPED ]
    WargearRemapEntry:
      type: object
      properties:
        slotName:
          type: string
          description: The attachment slot the wargear is currently assigned to.
        targetSlotName:
          type: string
          description: The matching slot on the new definition, absent when the outcome is DROPPED.
        wargearName:
          type: string
          description: The wargear currently assigned, whether a recognised option or a custom label.
        outcome:
          $ref: '#/components/schemas/WargearRemapOutcome'
      required: [ slotName, wargearName, outcome ]
    ChangeModelDefinitionPreview:
      type: object
      description: >-
        A dry run of changing a collection model's definition, so the user can see what it will do
        to their recorded loadout before committing to it.
      properties:
        modelDefinitionId:
          type: string
          format: uuid
        modelDefinitionName:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/WargearRemapEntry'
      required: [ modelDefinitionId, entries ]
    GoogleAuthRequest:
      type: object
      properties:
        idToken:
          type: string
      required: [ idToken ]
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserDto'
      required: [ token, user ]
    UserDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          readOnly: true
          allOf:
            - $ref: '#/components/schemas/UserRole'
        themePreference:
          allOf:
            - $ref: '#/components/schemas/ThemePreference'
      required: [ id, email ]
    UserRole:
      type: string
      enum: [ GUEST, USER, ADMIN, SUPERADMIN ]
    ThemePreference:
      type: string
      description: >-
        A user's preferred UI colour scheme. AUTO follows the device's system preference.
      enum: [ LIGHT, DARK, AUTO ]
    UpdateUserRoleRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
      required: [ role ]
    UpdateThemePreferenceRequest:
      type: object
      properties:
        themePreference:
          $ref: '#/components/schemas/ThemePreference'
      required: [ themePreference ]
    BulkUpdateUserRolesRequest:
      type: object
      properties:
        userIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        role:
          $ref: '#/components/schemas/UserRole'
      required: [ userIds, role ]
