spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate.ddl-auto: validate
    show-sql: false
app:
  storage:
    uploads:
      enabled: ${STORAGE_UPLOADS_ENABLED:true}
      max-file-size-mb: 10
      max-storage-per-user-mb: 500
      max-uploads-per-hour: 100
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
battlereadyshelf:
  cors:
    allowed:
      origins: ${CORS_ALLOWED_ORIGINS}
